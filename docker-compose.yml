services:
  web:
    build: .
    container_name: portfolio-web
    ports:
      # HTTP: редирект на HTTPS + HTTP-01 challenge для Let's Encrypt.
      # Хостер-фаервол пропускает только 22/80/443 — прежний маппинг
      # 8081:80 снаружи был недоступен (тихий DROP), из-за закрытого :80
      # Yandex Webmaster видел отказ ("502") на http://bolotova.online:80.
      - "80:80"
      - "443:443"    # HTTPS с Let's Encrypt
    restart: unless-stopped
    volumes:
      # Монтируем Let's Encrypt сертификаты
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Для обновления сертификата
      - /var/www/certbot:/var/www/certbot:ro
