site_name: "Курс по бизнес-анализу"
site_url: "https://bolotova.online/course/"
docs_dir: "content"
site_dir: "site"

theme:
  name: material
  language: ru
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Тёмная тема
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Светлая тема
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - navigation.instant
    - navigation.instant.prefetch

plugins:
  - search:
      lang: ru
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true

extra:
  homepage: https://bolotova.online

# README.md BA_Course — инструкции для авторов, в навигацию курса не входит
not_in_nav: README.md

nav:
  - "← На основной сайт": "https://bolotova.online"
  - Курс:
      - Введение: index.md
      - "Модуль 1. Новый мир: от идеи к намерению": modul-1/index.md
      - "Модуль 2. Система знаний бизнес-аналитика": modul-2/index.md
      - Модуль 3. Моделирование процессов и данных: modul-3/index.md
      - Модуль 4. Артефакты как код (Doc-as-Code): modul-4/index.md
      - "Модуль 5. Управление требованиями: проверяемость, изменения, трассировка": modul-5/index.md
      - "Модуль 6. Совместная работа с AI: полный цикл и роль аналитика": modul-6/index.md
      - Итоговый проект: itogovyy-proekt.md
      - Материалы:
          - "Шаблон. Реестр стейкхолдеров": materialy/shablon-reestra-steykholderov.md
          - "Правовая справка. AI и законодательство РФ": materialy/pravovaya-spravka-rf.md
