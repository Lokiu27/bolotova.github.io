site_name: "Курс по бизнес-анализу"
site_url: "https://bolotova.online/course/"
docs_dir: "content"
site_dir: "site"

theme:
  name: material
  language: ru
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Тёмная тема
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Светлая тема
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - navigation.instant
    - navigation.instant.prefetch

plugins:
  - search:
      lang: ru
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true

extra:
  homepage: https://bolotova.online

# README.md BA_Course — инструкции для авторов, в навигацию курса не входит
not_in_nav: README.md

# nav не задаётся вручную: его собирает docs/generate_nav.py из свежего
# контента BA_Course перед каждой сборкой (CI: job build-course; локально:
# см. DEPLOY.md). Секции nav в этом файле быть не должно.
