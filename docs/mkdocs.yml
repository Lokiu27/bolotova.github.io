site_name: "Управление требованиями с AI"
site_url: "https://bolotova.online/course/"
docs_dir: "content"
site_dir: "site"

theme:
  name: material
  # Оверрайд<head>: og-теги и JSON-LD Course (docs/custom/main.html).
  # Путь относительно расположения mkdocs.yml; в CI конфиг копируется в
  # docs-build/, поэтому "../docs" — репозиторный docs/ (cwd = корень репо).
  custom_dir: "../docs/custom"
  language: ru
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Тёмная тема
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Светлая тема
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - navigation.instant
    - navigation.instant.prefetch

plugins:
  - search:
      lang: ru
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true

extra:
  homepage: https://bolotova.online
  # og:image курса — картинка лежит на основном сайте и генерируется
  # npm run og:image:course (scripts/generate-og-image-course.ts)
  og_image_course: https://bolotova.online/assets/images/og-image-course.jpg

# Мета-слой курса: built-in meta-плагин Material (og:title и т.д.) появился
# только в 9.6, а requirements.txt держит 9.5.47 — поэтому og:title /
# og:description / og:type / og:image и JSON-LD Course добавляет оверрайд
# docs/custom/main.html (блок extrahead base.html), а page title и
# description — front-matter страниц BA_Course.

# README.md BA_Course — инструкции для авторов, в навигацию курса не входит
not_in_nav: README.md

# nav не задаётся вручную: его собирает docs/generate_nav.py из свежего
# контента BA_Course перед каждой сборкой (CI: job build-course; локально:
# см. DEPLOY.md). Секции nav в этом файле быть не должно.
