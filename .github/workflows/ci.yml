name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  repository_dispatch:
    types: [ content-updated ]
  # Ручной запуск деплоя (Actions → CI/CD → Run workflow).
  # Код на VPS выкачивается с origin/main, статика — из артефакта текущего
  # рана: при запуске не с main они могут различаться.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # Puppeteer качает Chromium (~170 МБ) при npm ci — кэшируем,
      # чтобы не тратить 1-2 минуты на каждый ран
      - name: Cache Puppeteer Chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            puppeteer-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # vite build + Puppeteer-пререндер: статический HTML с per-page
      # мета-тегами, canonical и JSON-LD для каждого маршрута + 404.html
      - name: Build project (vite build + prerender)
        run: npm run build:prerender

      # Готовый пререндеренный сайт уезжает артефактом: на VPS больше ничего
      # не собирается (npm ci и vite build на VPS подвешивали деплой — слабый
      # CPU и деградированная сеть). Деплой просто копирует этот dist на сервер.
      - name: Upload SPA bundle
        uses: actions/upload-artifact@v7
        with:
          name: spa-dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      # Формат секрета VPS_CONFIG (JSON):
      # Вариант 1 (рекомендуется): с base64-кодированным SSH ключом
      # {
      #   "host": "your-vps-host.com",
      #   "username": "deploy",
      #   "port": "22",
      #   "project_path": "/path/to/project",
      #   "ssh_key_base64": "base64-encoded-ssh-key"
      # }
      # Для получения base64: cat ~/.ssh/id_rsa | base64 -w 0
      #
      # Вариант 2: с экранированным SSH ключом (используйте \n для переносов строк)
      # {
      #   "host": "your-vps-host.com",
      #   "username": "deploy",
      #   "port": "22",
      #   "project_path": "/path/to/project",
      #   "ssh_key": "-----BEGIN OPENSSH PRIVATE KEY-----\\n...\\n-----END OPENSSH PRIVATE KEY-----"
      # }
      - name: Parse VPS config
        id: vps_config
        run: |
          # Парсим JSON конфигурацию используя Python (встроен в GitHub Actions)
          python3 << 'EOF'
          import json
          import os
          import base64
          import re
          
          vps_config_json = os.environ['VPS_CONFIG']
          
          # Функция для очистки JSON от управляющих символов и объединения многострочных base64 строк
          def clean_json_strings(json_str):
              # Обрабатываем случай, когда base64 строка разбита на несколько строк
              # Используем простой подход: находим все между "ssh_key_base64": " и следующей кавычкой
              # которая не экранирована и за которой следует запятая или закрывающая скобка
              
              def fix_base64_multiline(match):
                  prefix = match.group(1)  # "ssh_key_base64": "
                  value = match.group(2)   # содержимое (может быть многострочным)
                  # Удаляем все пробелы, переносы строк и табуляции из base64
                  cleaned_value = re.sub(r'\s+', '', value)
                  return prefix + cleaned_value + '"'
              
              # Паттерн для поиска: "ssh_key_base64": "многострочное значение"
              # Используем non-greedy match до следующей кавычки, за которой идет запятая или }
              pattern = r'("ssh_key_base64"\s*:\s*")(.*?)"(?=\s*[,}])'
              result = re.sub(pattern, fix_base64_multiline, json_str, flags=re.DOTALL)
              
              # Теперь обрабатываем обычные строковые значения с управляющими символами
              def fix_control_chars(match):
                  prefix = match.group(1)
                  value = match.group(2)
                  # Заменяем управляющие символы на экранированные версии
                  value = value.replace('\n', '\\n').replace('\r', '\\r').replace('\t', '\\t')
                  return prefix + value + '"'
              
              # Паттерн для других строковых полей с управляющими символами
              pattern2 = r'("(?:host|username|port|project_path|ssh_key)"\s*:\s*")([^"]*(?:\n|\r|\t)[^"]*)"'
              result = re.sub(pattern2, fix_control_chars, result, flags=re.DOTALL)
              
              return result
          
          try:
              # Пытаемся распарсить как есть
              config = json.loads(vps_config_json)
          except json.JSONDecodeError as e:
              # Если не получилось, пытаемся очистить от управляющих символов и объединить многострочные base64
              try:
                  cleaned_json = clean_json_strings(vps_config_json)
                  config = json.loads(cleaned_json)
              except (json.JSONDecodeError, Exception) as e2:
                  print("=" * 80)
                  print("ОШИБКА: Не удалось распарсить JSON конфигурацию")
                  print("=" * 80)
                  print(f"Детали ошибки: {e2}")
                  if hasattr(e2, 'pos'):
                      pos = e2.pos
                      start = max(0, pos - 100)
                      end = min(len(vps_config_json), pos + 100)
                      print(f"\nКонтекст вокруг ошибки (позиция {pos}):")
                      print(vps_config_json[start:end])
                  print("\n" + "=" * 80)
                  print("РЕШЕНИЕ: Используйте base64 для SSH ключа!")
                  print("=" * 80)
                  print("1. Закодируйте ваш SSH ключ в base64:")
                  print("   cat ~/.ssh/id_rsa | base64 -w 0")
                  print("   (или на macOS: cat ~/.ssh/id_rsa | base64)")
                  print("\n2. Используйте поле 'ssh_key_base64' вместо 'ssh_key' в JSON:")
                  print('   {"host": "...", "username": "...", "port": "22",')
                  print('    "project_path": "...", "ssh_key_base64": "BASE64_STRING"}')
                  print("=" * 80)
                  raise ValueError("JSON парсинг не удался. Используйте ssh_key_base64 для SSH ключа.")
          
          # Получаем SSH ключ (поддерживаем оба формата)
          if 'ssh_key_base64' in config:
              # Декодируем SSH ключ из base64
              ssh_key = base64.b64decode(config['ssh_key_base64']).decode('utf-8')
          elif 'ssh_key' in config:
              # Используем ssh_key напрямую (должен быть экранирован в JSON)
              ssh_key = config['ssh_key'].replace('\\n', '\n').replace('\\r', '\r').replace('\\t', '\t')
          else:
              raise ValueError("Не найден ssh_key или ssh_key_base64 в конфигурации")
          
          # Записываем значения в outputs
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"host={config['host']}\n")
              f.write(f"username={config['username']}\n")
              f.write(f"port={config['port']}\n")
              f.write(f"project_path={config['project_path']}\n")
              # SSH ключ записываем с многострочным форматом
              f.write("ssh_key<<EOF\n")
              f.write(ssh_key)
              f.write("\nEOF\n")
          EOF
        env:
          VPS_CONFIG: ${{ secrets.VPS_CONFIG }}

      - name: Write VPS SSH key to file
        env:
          VPS_KEY: ${{ steps.vps_config.outputs.ssh_key }}
        run: |
          # Пишем через env, а не через контекстные интерполяции, иначе ключ
          # попадёт в отображаемую команду шага (группа Run в логах)
          printf '%s\n' "$VPS_KEY" > /home/runner/work/_temp/vps_deploy_key
          chmod 600 /home/runner/work/_temp/vps_deploy_key

      - name: Download SPA bundle
        uses: actions/download-artifact@v8
        with:
          name: spa-dist
          path: dist

      - name: Update code on VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ steps.vps_config.outputs.host }}
          username: ${{ steps.vps_config.outputs.username }}
          # Экшен выполняется в контейнере: /home/runner/work/_temp на хосте
          # смонтированы как /github/runner_temp внутри контейнера — ключ должен
          # лежать по контейнерному пути, иначе файл не найдётся и аутентификация
          # упадёт с "attempted methods [none]"
          key_path: /github/runner_temp/vps_deploy_key
          port: ${{ steps.vps_config.outputs.port }}
          command_timeout: 10m
          script: |
            set -e
            cd ~
            project_path=${{ steps.vps_config.outputs.project_path }}
            repo_url=https://github.com/Lokiu27/bolotova.github.io

            # Сеть VPS↔GitHub деградирована: зависший перенос может висеть
            # вечно. Гит должен рвать связь сам: <1КБ/с в течение 60с = аборт
            export GIT_HTTP_LOW_SPEED_LIMIT=1024
            export GIT_HTTP_LOW_SPEED_TIME=60
            export GIT_HTTP_VERSION=HTTP/1.1

            stamp() { echo "[$(date -u +%H:%M:%S)] $*"; }

            retry() {
              for attempt in 1 2 3; do
                if "$@"; then
                  stamp "готово (попытка $attempt)"
                  return 0
                fi
                stamp "попытка $attempt не удалась, повтор через 15с"
                sleep 15
              done
              return 1
            }

            if [ -d "$project_path/.git" ]; then
              stamp "обновляем существующий чекаут (fetch/reset)"
              git -C "$project_path" config http.version HTTP/1.1
              retry git -C "$project_path" fetch --depth 1 origin main
              git -C "$project_path" reset --hard origin/main
              # -fd, не -fdx: dist-prebuilt/ в .gitignore, вычищать его не надо
              git -C "$project_path" clean -fd
            else
              stamp "свежий shallow-клон"
              rm -rf "$project_path"
              ok=0
              for attempt in 1 2 3; do
                if git clone --depth 1 "$repo_url" "$project_path"; then
                  ok=1
                  stamp "клон готов (попытка $attempt)"
                  break
                fi
                stamp "клон (попытка $attempt) не удался, чищу недоклон"
                rm -rf "$project_path"
                [ "$attempt" = "3" ] || sleep 15
              done
              [ "$ok" = "1" ] || { stamp "ОШИБКА: клон не удался за 3 попытки"; exit 1; }
            fi
            stamp "код на VPS: $(git -C "$project_path" rev-parse --short origin/main)"

      - name: Upload SPA bundle to VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ steps.vps_config.outputs.host }}
          username: ${{ steps.vps_config.outputs.username }}
          # scp-action@v1.0.0 — composite-экшен: выполняется прямо на раннер-VM,
          # а не в контейнере, поэтому контейнерного /github/runner_temp для него
          # нет — ключ читается по хостовому пути (куда его и пишет шаг записи)
          key_path: /home/runner/work/_temp/vps_deploy_key
          port: ${{ steps.vps_config.outputs.port }}
          source: "dist/*"
          target: ${{ steps.vps_config.outputs.project_path }}/dist-prebuilt
          strip_components: 1
          # rm: заменяет каталог целиком — старые хэшированные ассеты
          # не накапливаются между деплоями
          rm: true
          command_timeout: 20m

      - name: Build and restart container on VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ steps.vps_config.outputs.host }}
          username: ${{ steps.vps_config.outputs.username }}
          key_path: /github/runner_temp/vps_deploy_key
          port: ${{ steps.vps_config.outputs.port }}
          # Образ COPY-only (только COPY-слои), запас — на случай подтягивания
          # базового nginx-образа
          command_timeout: 15m
          script: |
            set -e
            project_path=${{ steps.vps_config.outputs.project_path }}
            stamp() { echo "[$(date -u +%H:%M:%S)] $*"; }

            cd "$project_path"
            if [ ! -f dist-prebuilt/index.html ]; then
              stamp "ОШИБКА: dist-prebuilt/index.html нет — бандл не доехал"
              exit 1
            fi
            stamp "docker compose build/up (COPY-only, без npm/vite)"
            docker compose up -d --build
            docker compose ps
            docker image prune -f

      # После деплоя удаляем ключ с диска раннера (и при успехе, и при ошибке)
      - name: Cleanup SSH key
        if: always()
        run: rm -f /home/runner/work/_temp/vps_deploy_key
